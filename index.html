<!-- /index.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InkyVibes Stories</title>

  <style>
    :root{
      --story-size: clamp(56px, 7vw, 88px);
      --ring: clamp(3px, 0.45vw, 5px);
      --modal-radius: 18px;
      --panel-pad: 18px;

      /* Modal story viewer should look like IG */
      --viewer-max-w: 520px;
      --viewer-aspect: 9 / 16;
    }

    html, body{
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* IMPORTANT: don’t center vertically (Google Sites iframe looks empty otherwise) */
    body{
      display: block;
    }

    .storiesBlock{
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 12px;
      box-sizing: border-box;
    }

    .caption{
      font-size: clamp(14px, 1.8vw, 20px);
      font-weight: 400;
      letter-spacing: 0.12px;
      color: rgba(17, 17, 17, 0.55);
      text-align: center;
      margin: 6px 0 14px;
    }

    .stories{
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: clamp(10px, 1.4vw, 22px);
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 4px 10px;
      -webkit-overflow-scrolling: touch;
      box-sizing: border-box;
    }

    .story{
      border: 0;
      padding: 0;
      cursor: pointer;
      background: transparent;
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    .ring{
      width: var(--story-size);
      height: var(--story-size);
      border-radius: 999px;
      background: conic-gradient(
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5,
        #feda75
      );
      display: grid;
      place-items: center;
      padding: var(--ring);
      box-sizing: border-box;
    }

    .inner{
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: #fff;
      display: grid;
      place-items: center;
      overflow: hidden;
      box-sizing: border-box;
    }

    .logo{
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 999px;
      transform: scale(1.02);
      display: block;
    }

    .label{
      font-size: 12px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: 0.12px;
      color: rgba(17, 17, 17, 0.65);
      white-space: nowrap;
      text-align: center;
      user-select: none;
    }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      display: none;
      z-index: 9999;
    }
    .modal[aria-hidden="false"]{ display:block; }

    .backdrop{
      position:absolute;
      inset:0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      touch-action: none;
    }

    .panel{
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--panel-pad);
      box-sizing: border-box;
    }

    /* Key fix: 9:16 viewer so no weird empty space */
    .frameWrap{
      width: min(var(--viewer-max-w), calc(100vw - (var(--panel-pad) * 2)));
      aspect-ratio: var(--viewer-aspect);
      max-height: calc(100vh - (var(--panel-pad) * 2));
      border-radius: var(--modal-radius);
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.18);
      position: relative;
      transform: translateZ(0);
      -webkit-mask-image: -webkit-radial-gradient(white, black);
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
      background: transparent;
      display:block;
      border-radius: inherit;
      overflow: hidden;
    }

    .closeBtn{
      position:absolute;
      top: 14px;
      right: 14px;
      border: 0;
      border-radius: 999px;
      padding: 10px 12px;
      cursor: pointer;
      background: rgba(0,0,0,.6);
      color: #fff;
      font-size: 16px;
      line-height: 1;
      z-index: 2;
    }

    @media (max-width: 640px){
      :root{ --panel-pad: 10px; --viewer-max-w: 1000px; }
      .frameWrap{
        width: calc(100vw - (var(--panel-pad) * 2));
        max-height: calc(100vh - (var(--panel-pad) * 2));
      }
    }

    /* Optional: embed mode: caption hide -> needs less height visually */
    body.embed .caption{ display:none; margin:0; }
    body.embed .storiesBlock{ padding-top: 8px; }
  </style>
</head>

<body>
  <div class="storiesBlock">
    <div class="caption">Instagram Stories</div>

    <div class="stories" aria-label="Stories">
      <button class="story" type="button" data-src="https://johnsimsek.github.io/Instagram-story/" aria-label="Tattoos 1">
        <div class="ring"><div class="inner">
          <img class="logo" src="logo.jpg" alt="InkyVibes logo">
        </div></div>
        <div class="label">Tattoos 1</div>
      </button>

      <button class="story" type="button" data-src="https://johnsimsek.github.io/Insta-story2/" aria-label="Tattoos 2">
        <div class="ring"><div class="inner">
          <img class="logo" src="logo.jpg" alt="InkyVibes logo">
        </div></div>
        <div class="label">Tattoos 2</div>
      </button>

      <button class="story" type="button" data-src="https://johnsimsek.github.io/Insta-story-healed/" aria-label="Healed">
        <div class="ring"><div class="inner">
          <img class="logo" src="logo.jpg" alt="InkyVibes logo">
        </div></div>
        <div class="label">Healed</div>
      </button>

      <button class="story" type="button" data-src="https://johnsimsek.github.io/Insta-stories-3/" aria-label="Tattoos 3">
        <div class="ring"><div class="inner">
          <img class="logo" src="logo.jpg" alt="InkyVibes logo">
        </div></div>
        <div class="label">Tattoos 3</div>
      </button>
    </div>
  </div>

  <div class="modal" aria-hidden="true" id="modal">
    <div class="backdrop" id="backdrop"></div>
    <div class="panel" id="panel">
      <button class="closeBtn" id="closeBtn" aria-label="Kapat">✕</button>

      <div class="frameWrap" id="frameWrap">
        <iframe
          id="frame"
          title="Story"
          loading="eager"
          referrerpolicy="no-referrer"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
          allow="fullscreen"
        ></iframe>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById("modal");
    const frame = document.getElementById("frame");
    const backdrop = document.getElementById("backdrop");
    const closeBtn = document.getElementById("closeBtn");

    function normalizeUrl(url) {
      try { return new URL(url).toString(); }
      catch { return url; }
    }

    function isEmbedded() {
      try { return window.self !== window.top; } catch { return true; }
    }

    function openStory(url) {
      const lockedUrl = normalizeUrl(url);

      // Google Sites embed: iframe height auto change yok → full story’i yeni sekmede aç
      if (isEmbedded()) {
        const w = window.open(lockedUrl, "_blank", "noopener,noreferrer");
        if (w) return;

        // popup block olursa: en azından aynı iframe’de aç
        window.location.href = lockedUrl;
        return;
      }

      // Normal web: modal
      frame.src = lockedUrl;
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      modal.setAttribute("aria-hidden", "true");
      frame.src = "";
      document.body.style.overflow = "";
    }

    closeBtn.addEventListener("click", closeModal);
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeModal(); });

    document.querySelectorAll(".story").forEach((btn) => {
      btn.addEventListener("click", () => openStory(btn.dataset.src));
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.getAttribute("aria-hidden") === "false") closeModal();
    });

    // Optional: add ?embed=1 to hide caption in Google Sites
    try {
      const params = new URLSearchParams(location.search);
      if (params.get("embed") === "1") document.body.classList.add("embed");
    } catch {}
  </script>
</body>
</html>
